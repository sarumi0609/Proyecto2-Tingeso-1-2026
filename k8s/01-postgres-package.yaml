# ============================================================
# PostgreSQL para package-service
# ============================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: package-postgres-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: package-postgres
spec:
  selector:
    matchLabels:
      app: package-postgres
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: package-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: package-db-secret
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: package-db-secret
                  key: password
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: package-db-secret
                  key: dbname
          volumeMounts:
            - name: storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: package-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: package-postgres
spec:
  selector:
    app: package-postgres
  ports:
    - port: 5432
      targetPort: 5432
  clusterIP: None   # Headless para acceso directo por nombre
