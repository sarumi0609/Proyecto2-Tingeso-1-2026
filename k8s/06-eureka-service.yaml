# ============================================================
# Eureka Service — puerto fijo 8761, ClusterIP
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka-service
spec:
  selector:
    matchLabels:
      app: eureka-service
  replicas: 1
  template:
    metadata:
      labels:
        app: eureka-service
    spec:
      containers:
        - name: eureka-service
          image: sarumimope/eureka-service:latest
          ports:
            - containerPort: 8761
          env:
            - name: CONFIG_SERVER_URL
              value: "http://config-service:8888"
            - name: SPRING_CONFIG_IMPORT
              value: "configserver:http://config-service:8888"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8761
            initialDelaySeconds: 40
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: eureka-service
spec:
  selector:
    app: eureka-service
  ports:
    - port: 8761
      targetPort: 8761
  type: ClusterIP
