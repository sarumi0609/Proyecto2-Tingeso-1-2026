# ============================================================
# Secrets para bases de datos PostgreSQL
# Valores en base64:  echo -n "valor" | base64
#   postgres  → cG9zdGdyZXM=
#   packagedb → cGFja2FnZWRi
#   reservationdb → cmVzZXJ2YXRpb25kYg==
#   paymentdb → cGF5bWVudGRi
# ============================================================

# --- Package service DB ---
apiVersion: v1
kind: Secret
metadata:
  name: package-db-secret
type: Opaque
data:
  username: cG9zdGdyZXM=       # postgres
  password: cG9zdGdyZXM=       # postgres
  dbname: cGFja2FnZWRi         # packagedb
---
# --- Reservation service DB ---
apiVersion: v1
kind: Secret
metadata:
  name: reservation-db-secret
type: Opaque
data:
  username: cG9zdGdyZXM=          # postgres
  password: cG9zdGdyZXM=          # postgres
  dbname: cmVzZXJ2YXRpb25kYg==   # reservationdb
---
# --- Payment service DB ---
apiVersion: v1
kind: Secret
metadata:
  name: payment-db-secret
type: Opaque
data:
  username: cG9zdGdyZXM=    # postgres
  password: cG9zdGdyZXM=    # postgres
  dbname: cGF5bWVudGRi       # paymentdb
---
# --- Keycloak admin credentials ---
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-secret
type: Opaque
data:
  admin-user: YWRtaW4=      # admin
  admin-password: YWRtaW4=  # admin
