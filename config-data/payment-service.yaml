server:
  port: 0

eureka:
  client:
    service-url:
      defaultZone: http://eureka-service:8761/eureka
  instance:
    prefer-ip-address: true

spring:
  datasource:
    url: jdbc:postgresql://${DB_PAYMENT_HOST:localhost}:5432/${DB_PAYMENT_NAME:paymentdb}
    username: ${DB_PAYMENT_USER:postgres}
    password: sarumi
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
