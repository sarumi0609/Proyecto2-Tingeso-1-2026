server:
  port: 0

eureka:
  client:
    service-url:
      defaultZone: http://eureka-service:8761/eureka
  instance:
    prefer-ip-address: true

spring:
  datasource:
    url: jdbc:postgresql://${DB_PACKAGE_HOST:localhost}:5432/${DB_PACKAGE_NAME:packagedb}
    username: ${DB_PACKAGE_USER:postgres}
    password: ${DB_PACKAGE_PASS:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
